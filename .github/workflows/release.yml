name: Build and Release

on:
  workflow_call:
    inputs:
      version:
        description: Canonical project version, optionally prefixed with v
        required: true
        type: string
      release_tag:
        description: GitHub Release tag to publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: unraid-firewall-release-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      release_tag: ${{ steps.version.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Resolve version
        id: version
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          REQUESTED_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          VERSION="${REQUESTED_VERSION#v}"
          RELEASE_TAG="${REQUESTED_TAG}"
          SOURCE_VERSION="$(tr -d '\r\n' < VERSION)"
          [[ "${VERSION}" =~ ^[0-9]{4}\.[0-9]{2}\.[0-9]{2}\.[0-9]{4}(-(alpha|beta|rc)[0-9]*)?$ ]]
          [[ "${RELEASE_TAG}" =~ ^v?[0-9]{4}\.[0-9]{2}\.[0-9]{2}\.[0-9]{4}(-(alpha|beta|rc)[0-9]*)?$ ]]
          [[ "${RELEASE_TAG#v}" == "${VERSION}" ]]
          [[ "${VERSION}" == "${SOURCE_VERSION}" ]]
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "release_tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=${RELEASE_TAG}" >> "$GITHUB_ENV"
          echo "SOURCE_VERSION=${SOURCE_VERSION}" >> "$GITHUB_ENV"

      - name: Validate source
        shell: bash
        run: |
          set -euo pipefail
          find src -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          php tests/validate.php
          php tests/render-pages.php
          php tests/translation-keys.php
          while IFS= read -r -d '' file; do
            bash -n "$file"
          done < <(find src -type f \( -name '*.sh' -o -name 'rc.unraid-firewall' \) -print0)

      - name: Build package
        shell: bash
        run: |
          set -euo pipefail
          bash build.sh
          PKG_FILE="unraid-firewall-${VERSION}-noarch-1.txz"
          test -s "${PKG_FILE}"
          sha256sum -c "${PKG_FILE}.sha256"

      - name: Generate release plugin manifests
        shell: bash
        run: |
          set -euo pipefail
          PKG_FILE="unraid-firewall-${VERSION}-noarch-1.txz"
          SHA256="$(sha256sum "${PKG_FILE}" | awk '{print $1}')"
          SOURCE_PATTERN="$(printf '%s' "${SOURCE_VERSION}" | sed 's/[.[\*^$\\]/\\&/g')"
          sed -E \
            -e "s/${SOURCE_PATTERN}/${VERSION}/g" \
            -e "s|releases/download/[^/]+/unraid-firewall-[^\"<]+-noarch-1\\.txz|releases/download/${RELEASE_TAG}/unraid-firewall-${VERSION}-noarch-1.txz|g" \
            -e "s|<SHA256>[^<]+</SHA256>|<SHA256>${SHA256}</SHA256>|" \
            plugin/unraid-firewall.plg > "unraid-firewall-${VERSION}.plg"
          cp "unraid-firewall-${VERSION}.plg" unraid-firewall.plg
          ! grep -q REPLACE_WITH_RELEASE_SHA256 unraid-firewall.plg
          printf '%s  %s\n' "${SHA256}" "${PKG_FILE}" > checksums.txt

      - uses: actions/upload-artifact@v4
        with:
          name: unraid-firewall-release-assets
          path: |
            unraid-firewall-${{ steps.version.outputs.version }}-noarch-1.txz
            unraid-firewall-${{ steps.version.outputs.version }}-noarch-1.txz.sha256
            unraid-firewall-${{ steps.version.outputs.version }}.plg
            unraid-firewall.plg
            checksums.txt
          retention-days: 14

  release:
    needs: build
    if: needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: unraid-firewall-release-assets
          path: dist

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ needs.build.outputs.version }}
          tag_name: ${{ needs.build.outputs.release_tag }}
          prerelease: ${{ contains(needs.build.outputs.version, '-') }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: dist/*
